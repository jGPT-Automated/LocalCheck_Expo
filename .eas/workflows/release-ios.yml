name: Release iOS (build + TestFlight)

defaults:
  tools:
    node: "22"
    pnpm: "10.13.1"

# Manual fallback for a TestFlight build started from the EAS dashboard. The
# normal path is GitHub Actions `.github/workflows/release-ios.yml` ("Run
# workflow"), also manual only (D22): merges to main never build. Each run
# spends one of the Expo plan's monthly iOS builds.
#
# Signing is handled by the distribution cert + provisioning profile stored on
# EAS. Submission uses the App Store Connect API key stored on EAS (no local
# .p8, no Apple ID login). appVersionSource is "remote", so the build number
# auto-increments server-side.

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
