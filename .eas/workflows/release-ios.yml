name: Release iOS (build + TestFlight)

defaults:
  tools:
    node: "22"
    pnpm: "10.13.1"

# Release path: build a fresh production iOS binary and submit it to App Store
# Connect / TestFlight after each approved merge to main. This also covers
# native changes that cannot ship over the air.
#
# Manual fallback for releases launched from the EAS dashboard. The automatic
# main -> TestFlight path lives in .github/workflows/release-ios.yml so an
# exhausted EAS Workflows-minute allowance cannot prevent a production build.
#
# Signing is handled by the distribution cert + provisioning profile stored on
# EAS. Submission uses the App Store Connect API key stored on EAS (no local
# .p8, no Apple ID login). appVersionSource is "remote", so the build number
# auto-increments server-side.

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
