name: Release iOS to TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-build:
    name: Build and submit to TestFlight
    runs-on: ubuntu-latest
    # A green check here used to mean only "the build was queued" (--no-wait
    # exits the moment EAS accepts the job) — the actual native build and
    # ASC submission ran unobserved afterward, so a real failure there (bad
    # credentials, a rejected binary, a stuck submission) never turned this
    # check red. Waiting for the real outcome takes longer but makes the
    # check trustworthy: green now means the build actually reached
    # TestFlight.
    timeout-minutes: 45

    steps:
      - name: Require Expo authentication
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is required for the TestFlight release."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit to TestFlight
        run: >-
          eas build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
