name: Release iOS to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue-build:
    name: Queue EAS build and TestFlight submission
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require Expo authentication
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is required for the TestFlight release."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Queue production build and TestFlight submission
        run: >-
          eas build
          --platform ios
          --profile production
          --auto-submit
          --non-interactive
          --no-wait
