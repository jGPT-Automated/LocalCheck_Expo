name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Compile-only placeholders. CI exports are never connected previews.
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      EXPO_PUBLIC_MAPBOX_TOKEN: pk.ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        run: pnpm check

      - name: Bundle web target (compile only)
        run: pnpm export:web -- --output-dir /tmp/localcheck-ci-export

      - name: Prove CI bundle is not a connected preview
        run: node scripts/assert-export-placeholder.mjs /tmp/localcheck-ci-export/_expo/static/js/web https://ci-placeholder.invalid

  docs:
    name: docs updated
    # Every push to a pull request that changes the product must update the
    # docs in the same push (AGENTS.md "Docs on every push"; D54).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check this push updated the docs
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          FROM="$BASE"
          if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            FROM="$BEFORE"
          fi
          node scripts/check-docs-updated.mjs "$FROM" "$HEAD"
