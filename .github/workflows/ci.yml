name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Compile-only placeholders. CI exports are never connected previews.
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      EXPO_PUBLIC_MAPBOX_TOKEN: pk.ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        run: pnpm check

      - name: Bundle web target (compile only)
        run: pnpm export:web -- --output-dir /tmp/localcheck-ci-export

      - name: Prove CI bundle is not a connected preview
        run: node scripts/assert-export-placeholder.mjs /tmp/localcheck-ci-export/_expo/static/js/web https://ci-placeholder.invalid
