<!-- @dsCard group="Shape" name="Radius Ramp" subtitle="3px actions → 28px surfaces" viewport="780x300" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head><body class="lc-root">
<div class="grp"><div class="cap">Actions</div><div class="row">
<div style="width:96px;height:52px;border-radius:3px;background:var(--orange);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em">3 NAV CTA</div>
<div style="width:96px;height:52px;border-radius:4px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">4 BUTTON</div>
<div style="width:96px;height:52px;border-radius:7px;background:var(--cell);border:1px solid var(--line-soft);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">7 HEAT CELL</div>
<div style="width:96px;height:52px;border-radius:8px;background:var(--input);border:1px solid var(--line);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">8 INPUT</div>
<div style="width:96px;height:52px;border-radius:11px;background:var(--fill-01);border:1px solid var(--line-mid);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">11 CHIP</div>
<div style="width:96px;height:52px;border-radius:999px;background:rgba(12,12,15,.4);border:1px solid var(--line-mid);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">PILL</div>
</div></div>
<div class="grp"><div class="cap">Surfaces</div><div class="row">
<div style="width:112px;height:72px;border-radius:16px;background:var(--panel);border:1px solid var(--line-mid);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">16 LIST CARD</div>
<div style="width:112px;height:72px;border-radius:18px;background:var(--panel);border:1px solid var(--line-mid);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">18 FLOATING</div>
<div style="width:112px;height:72px;border-radius:22px;background:var(--panel);border:1px solid var(--line-mid);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">22 PANEL</div>
<div style="width:112px;height:72px;border-radius:23px;background:var(--card);border:1px solid var(--line-mid);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">23 COURT CARD</div>
<div style="width:112px;height:72px;border-radius:25px;background:var(--modal);border:1px solid var(--line);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">25 MODAL</div>
<div style="width:112px;height:72px;border-radius:28px;background:var(--map-bg);border:1px solid var(--line);display:grid;place-items:center;font-size:8px;font-weight:760;letter-spacing:.1em;color:var(--ink-4)">28 MAP</div>
</div><p class="note">The more content a surface holds, the rounder it is. Buttons stay near-square so they read as mechanical.</p></div></body></html>
