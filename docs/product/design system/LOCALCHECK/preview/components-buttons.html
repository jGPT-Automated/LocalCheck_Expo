<!-- @dsCard group="Components" name="Buttons" subtitle="Orange primary, outline, checked, text, icon" viewport="780x400" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head><body class="lc-root">
<div class="grp"><div class="cap">Primary — orange, 48px (54px hero), radius 4</div><div class="row">
<button class="lc-btn lc-btn--hero">Explore 56 courts →</button>
<button class="lc-btn">Check in</button>
<button class="lc-btn lc-btn--sm">Check in</button>
<button class="lc-btn lc-btn--nav">Check in</button>
<button class="lc-btn" style="background:var(--orange-bright);transform:translateY(-2px)">Hover</button>
</div><p class="note">Hover changes fill to #ff641e and lifts 2px. Buttons never change color to signal anything but hover.</p></div>
<div class="grp"><div class="cap">Secondary &amp; checked-in state</div><div class="row">
<button class="lc-btn lc-btn--view">View court →</button>
<button class="lc-btn lc-btn--sm lc-btn--checked">✓ Checked in</button>
<button class="lc-btn-tint">Mark going</button>
</div></div>
<div class="grp"><div class="cap">Text button — underline turns orange</div><div class="row" style="gap:28px">
<button class="lc-text-btn">See how it works ›</button>
<button class="lc-text-btn" style="border-color:var(--orange);color:#fff">Explore competition ›</button>
</div></div>
<div class="grp"><div class="cap">Icon &amp; circular</div><div class="row">
<button class="lc-icon-btn">✕</button>
<span class="lc-glass--float" style="display:inline-flex;min-height:40px;align-items:center;gap:8px;padding:0 14px;font-size:8px;font-weight:740;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)">Fit to courts</span>
<span style="display:grid;width:34px;height:34px;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--fill-02);color:var(--ink-3);font-size:12px">→</span>
<span style="display:grid;width:42px;height:42px;place-items:center;border-radius:50%;background:var(--orange);color:#fff;font-size:13px">↗</span>
</div></div></body></html>
