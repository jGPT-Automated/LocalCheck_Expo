<!-- @dsCard group="Components" name="Badges & Chips" subtitle="Status pills, sport pills, avatars, filters" viewport="780x380" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head><body class="lc-root">
<div class="grp"><div class="cap">Status pills — 29px, 999px, blur(10px)</div><div class="row">
<span class="lc-chip">Austin launch court</span>
<span class="lc-chip">1.2 mi</span>
<span class="lc-chip" style="color:#e0d0bf">⌂ Your local court</span>
<span class="lc-chip lc-chip--sport">Basketball</span>
<span class="lc-chip lc-chip--sport" style="--sport:var(--pball)">Pickleball</span>
</div></div>
<div class="grp"><div class="cap">Filter chips — 38px, radius 11</div><div class="row">
<button class="lc-filter-chip is-active">All sports</button>
<button class="lc-filter-chip">Basketball</button>
<button class="lc-filter-chip">Pickleball</button>
<button class="lc-filter-chip" style="border-color:var(--line-strong);color:#d5d5dd">Hover</button>
</div></div>
<div class="grp"><div class="cap">Avatars — the ring carries standing</div><div class="row">
<span class="lc-avatar lc-avatar--gold">JM</span>
<span class="lc-avatar lc-avatar--silver">AR</span>
<span class="lc-avatar lc-avatar--slate">TK</span>
<span class="lc-avatar">MC</span>
<span class="lc-avatar lc-avatar--live">YOU</span>
<span class="lc-avatar" style="border-style:dashed;color:#858591">+4</span>
<span style="display:flex;margin-left:14px">
<span class="lc-avatar lc-avatar--sm" style="border-color:#c89056;box-shadow:0 0 0 2px rgba(18,18,22,.92)">JM</span>
<span class="lc-avatar lc-avatar--sm" style="border-color:#98a3b7;margin-left:-8px;box-shadow:0 0 0 2px rgba(18,18,22,.92)">AR</span>
<span class="lc-avatar lc-avatar--sm" style="border-color:#737a70;margin-left:-8px;box-shadow:0 0 0 2px rgba(18,18,22,.92)">TK</span>
</span>
</div></div>
<div class="grp"><div class="cap">Signals &amp; separators</div><div class="row" style="gap:24px">
<span class="lc-label-micro" style="color:var(--ink-4)"><i class="lc-live-dot lc-live-dot--sm"></i> Orange always means live</span>
<span class="lc-label-micro"><i class="lc-live-dot lc-live-dot--off"></i> Idle local</span>
<span class="lc-label-micro" style="color:#858591">✓ Verified source</span>
<span style="display:inline-flex;align-items:center;gap:8px;color:var(--ink-5);font-size:12px">Austin, TX <i style="width:3px;height:3px;border-radius:50%;background:#5d5d68"></i> 2 courts</span>
</div></div></body></html>
