<!-- @dsCard group="Components" name="Inputs & Filters" subtitle="Search, text field, market select" viewport="760x320" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head><body class="lc-root">
<div class="grp"><div class="cap">Explorer search — focus turns the border orange</div>
<div class="lc-search" style="max-width:360px"><span style="font-size:12px">⌕</span><input placeholder="Search courts, cities, neighborhoods" style="min-width:0;flex:1;border:0;outline:0;background:transparent;color:#ededf1;font:inherit;font-size:11px"></div>
<div class="lc-search" style="max-width:360px;margin-top:10px;border-color:var(--orange-line);background:rgba(7,7,9,.5)"><span style="font-size:12px;color:var(--orange)">⌕</span><input value="hancock" style="min-width:0;flex:1;border:0;outline:0;background:transparent;color:#ededf1;font:inherit;font-size:11px"><button style="display:grid;width:27px;height:27px;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.055);color:#9999a4;cursor:pointer">✕</button></div></div>
<div class="grp"><div class="cap">Form field — 48px, radius 8, #111115</div><div class="row" style="align-items:flex-start;gap:16px">
<label style="display:grid;gap:7px;color:var(--dim);font-size:8px;font-weight:740;letter-spacing:.11em;text-transform:uppercase">Email<input class="lc-input" style="width:230px" placeholder="you@court.city"></label>
<label style="display:grid;gap:7px;color:var(--dim);font-size:8px;font-weight:740;letter-spacing:.11em;text-transform:uppercase">Focus<input class="lc-input" style="width:230px;border-color:var(--orange);box-shadow:0 0 0 3px rgba(252,76,2,.1)" value="jordan@localcheck.app"></label>
</div></div>
<div class="grp"><div class="cap">Market select — 42px, inline label</div>
<div style="display:flex;max-width:300px;min-height:42px;align-items:center;gap:10px;padding:0 12px;border:1px solid rgba(242,242,246,.095);border-radius:10px;background:var(--fill-01)"><span style="color:var(--dim-2);font-size:7px;font-weight:760;letter-spacing:.12em;text-transform:uppercase">Market</span><select style="min-width:0;flex:1;border:0;outline:0;background:var(--map-bg);color:#c9c9d1;font:inherit;font-size:9px"><option>All cities</option><option>Austin, TX</option></select></div></div></body></html>
