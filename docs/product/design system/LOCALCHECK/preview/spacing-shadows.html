<!-- @dsCard group="Shape" name="Elevation" subtitle="Deep soft shadows plus an inset hairline" viewport="780x300" -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head><body class="lc-root">
<div class="row" style="gap:18px;align-items:stretch">
<div style="flex:1;min-height:104px;border-radius:23px;border:1px solid var(--line-mid);background:var(--card);box-shadow:var(--sh-card);padding:14px"><div class="cap" style="margin:0">Court card</div><p class="note">0 24px 64px /.24 + inset 0 1px /.035</p></div>
<div style="flex:1;min-height:104px;border-radius:22px;border:1px solid var(--line-mid);background:var(--panel);box-shadow:var(--sh-panel);padding:14px"><div class="cap" style="margin:0">Panel</div><p class="note">0 22px 64px /.15 + inset hairline</p></div>
<div style="flex:1;min-height:104px;border-radius:24px;border:1px solid rgba(242,242,246,.13);background:linear-gradient(145deg,#22222a,#17171c);box-shadow:var(--sh-rank);padding:14px"><div class="cap" style="margin:0">Rank card</div><p class="note">0 38px 100px /.34</p></div>
</div>
<div class="row" style="gap:18px;align-items:stretch;margin-top:18px">
<div style="flex:1;min-height:104px;border-radius:25px;border:1px solid rgba(242,242,246,.14);background:var(--modal);box-shadow:var(--sh-modal);padding:14px"><div class="cap" style="margin:0">Modal</div><p class="note">0 50px 150px /.7</p></div>
<div style="flex:1;min-height:104px;border-radius:11px;border:1px solid var(--line);background:rgba(19,19,23,.9);box-shadow:var(--sh-chip);backdrop-filter:blur(15px);padding:14px"><div class="cap" style="margin:0">Floating chrome</div><p class="note">0 14px 36px /.25 + blur(15px)</p></div>
<div style="flex:1;min-height:104px;display:grid;place-items:center;border-radius:16px;border:1px solid var(--line-soft);background:var(--heather)"><div class="lc-marker"><span></span></div></div>
</div></body></html>
